# ---------------------------------------------------------------------------
# Content model for catalog entries.
#
# EVERYTHING derives from this file:
#   - the entry detail page and the catalog cards        (_layouts/entry.html, _includes/entry-card.html)
#   - the filter panel and search index                  (_includes/facet-filters.html, _plugins/search_index.rb)
#   - the public /submit/ web form                       (submit/index.md)
#   - the GitHub issue form (.github/ISSUE_TEMPLATE/new-entry.yml, generated by `npm run generate`)
#   - the issue -> pull request scaffolder               (scripts/new_entry_from_issue.mjs)
#   - front matter validation in CI                      (scripts/check_front_matter.rb)
#
# Field spec (each item under `fields`):
#   key         front matter key (snake_case, unique). Required.
#   label       human label shown everywhere. Required, must be unique.
#   type        text | textarea | markdown | url | email | select | multiselect | list | date | number | boolean | file | image
#                 - markdown: becomes the page BODY (only one field may be markdown)
#                 - multiselect: pick from `options`, stored as a YAML list
#                 - list: free-form, one per line (issue form) / comma separated (web form), stored as a YAML list
#                 - file: an attachment uploaded to the entry folder; `filename` sets the expected file name
#                 - image: path or URL to an image (used as thumbnail when key == "thumbnail")
#   required    true|false (default false)
#   description help text shown under the field in forms
#   placeholder example text shown in forms
#   options     list of allowed values (select / multiselect)
#   facet       true -> appears in the filter panel. select => single-choice filter, others => multi-choice
#   card        true -> shown on catalog cards (select => badge, list/multiselect => chips, text => meta line)
#   search      true -> included in the search index (title + summary always are)
#   section     details | links | contact   (where the field renders on the detail page sidebar; defaults by type)
#   form        false -> hidden from the submission forms (maintainer-only field, e.g. `featured`)
#   thumbnail   (file fields) true -> a thumb.jpg is generated from this PDF's first page in CI
#
# `title`, `slug`, `summary`, `published`, `thumbnail`, `featured` are always present
# in every entry, whether or not they are listed here.
# ---------------------------------------------------------------------------

entry:
  singular: "Use case"        # how one entry is referred to in the UI
  plural: "Use cases"
  path: "catalog"             # folder + URL base for entries (keep as "catalog" unless you know why)
  sort: "published"           # default catalog ordering key
  sort_order: "desc"          # asc | desc

sections:
  details: "Details"
  links: "Links & resources"
  contact: "Contact"

fields:
  - key: title
    label: "Title"
    type: text
    required: true
    placeholder: "Automated 311 call triage with LLM classification"
    description: "Short, descriptive name of the solution or project."

  - key: summary
    label: "One-sentence summary"
    type: textarea
    required: true
    description: "One or two sentences shown on the catalog card. Plain language, no jargon."
    placeholder: "Classifies incoming public health hotline calls by urgency and topic so nurses see the highest-priority cases first."

  - key: organization
    label: "Organization"
    type: text
    required: true
    facet: true
    card: true
    search: true
    placeholder: "Chicago Department of Public Health"
    description: "Health department, city, or member organization sharing this entry."

  - key: solution_type
    label: "Solution type"
    type: select
    required: true
    facet: true
    card: true
    options:
      - "Source code (GitHub or similar)"
      - "Cloud deployment (AWS, Azure, GCP)"
      - "Vendor product or partnership"
      - "Internal tool (no code shared)"
      - "Playbook, policy or write-up"
    description: "What kind of thing is being shared? Pick the closest match."

  - key: domain
    label: "Public health domain"
    type: multiselect
    required: true
    facet: true
    card: true
    options:
      - "Epidemiology & surveillance"
      - "Communications & outreach"
      - "Clinical & community services"
      - "Environmental health"
      - "Emergency preparedness"
      - "Operations & administration"
      - "Data, analytics & informatics"
      - "Policy & planning"
    description: "Select all that apply."

  - key: ai_tools
    label: "AI tools & models used"
    type: list
    required: true
    facet: true
    card: true
    search: true
    placeholder: "Azure OpenAI GPT-4o, LangChain, custom scikit-learn model"
    description: "Comma-separated. Name the models, platforms or libraries that matter."

  - key: stage
    label: "Stage"
    type: select
    required: true
    facet: true
    card: true
    options:
      - "Idea / exploring"
      - "Pilot"
      - "In production"
      - "Paused or retired"
    description: "Where is this today?"

  - key: repo_url
    label: "Source code repository"
    type: url
    section: links
    placeholder: "https://github.com/your-org/your-project"
    description: "Public GitHub / GitLab repository, if code is shared."

  - key: demo_url
    label: "Live deployment or demo"
    type: url
    section: links
    placeholder: "https://example.org/app"

  - key: docs_url
    label: "Documentation or write-up"
    type: url
    section: links
    placeholder: "https://example.org/docs"
    description: "Slides, a report, a blog post, or a vendor case study."

  - key: vendor
    label: "Vendor or partner"
    type: text
    section: details
    facet: true
    card: false
    search: true
    placeholder: "Acme Health AI"
    description: "If a vendor built or hosts the solution, name them here."

  - key: data_sources
    label: "Data sources"
    type: list
    section: details
    search: true
    placeholder: "Immunization registry, 311 call transcripts, ESSENCE"
    description: "Comma-separated. What data does the solution use? Public / de-identified only."

  - key: contact_name
    label: "Contact name"
    type: text
    required: true
    section: contact
    placeholder: "Jordan Lee"
    description: "Person others can reach out to with questions."

  - key: contact_email
    label: "Contact email"
    type: email
    required: true
    section: contact
    placeholder: "jordan.lee@city.gov"

  - key: deck_pdf
    label: "Slide deck or one-pager (PDF)"
    type: file
    filename: "deck.pdf"
    thumbnail: true
    section: links
    description: "Optional. After the pull request is created, upload deck.pdf into the entry folder and a thumbnail is generated automatically."

  - key: body
    label: "Full write-up"
    type: markdown
    required: true
    description: "Markdown is supported. Suggested headings: Problem, Approach, What it took (data, staffing, cost), Results, Lessons learned, How to reuse."
    placeholder: |
      ## Problem

      ## Approach

      ## What it took

      ## Results

      ## Lessons learned

      ## How to reuse this
