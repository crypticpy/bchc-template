# ---------------------------------------------------------------------------
# Content model for catalog entries.
#
# EVERYTHING derives from this file:
#   - the entry detail page and the catalog cards        (_layouts/entry.html, _includes/entry-card.html)
#   - the filter panel and search index                  (_includes/facet-filters.html, _plugins/search_index.rb)
#   - the public /submit/ wizard                         (submit/index.md, assets/js/submit.js)
#   - the GitHub issue form (.github/ISSUE_TEMPLATE/new-entry.yml, generated by `npm run generate`)
#   - the issue -> pull request scaffolder               (scripts/new_entry_from_issue.mjs)
#   - front matter validation in CI                      (scripts/check_front_matter.rb)
#
# Field spec (each item under `fields`):
#   key         front matter key (snake_case, unique). Required.
#   label       human label shown everywhere. Required, must be unique.
#   prompt      optional question-style label used in the submission forms ("What kind of data does it touch?");
#               falls back to `label`. Keep `label` short for cards, filters and the detail page.
#   type        text | textarea | markdown | url | email | select | multiselect | list | date | number |
#               boolean | file | image | images | links
#                 - markdown: becomes the page BODY (only one field may be markdown)
#                 - multiselect: pick from `options`, stored as a YAML list
#                 - list: free-form, one per line (issue form) / comma separated (web form), stored as a YAML list
#                 - file: an attachment uploaded to the entry folder; `filename` sets the expected file name
#                 - image: path or URL to an image (used as thumbnail when key == "thumbnail")
#                 - images: a gallery — YAML list of image paths/URLs or {src, alt} items. Submitters drop
#                   images into the GitHub issue; the scaffolder downloads them into the entry folder.
#                 - links: labelled links — YAML list of {label, url}. Forms accept "Label | URL" per line.
#   required    true|false (default false)
#   description help that the prompt does not already give: a constraint, an example, a boundary.
#               Forms print it straight after the prompt, so it must not restate it.
#   error       optional message shown when a required answer is missing; overrides the generated
#               default ("Enter an answer for <prompt>"). Write it as verb + the thing.
#   placeholder example text shown in forms
#   options     list of allowed values (select / multiselect)
#   option_meta optional per-option presentation: { "<option>": {short, icon, tone, description} }
#                 short        <= 14 chars, replaces the option on badges/chips/filters
#                 icon         name from _includes/icon.html
#                 tone         neutral | primary | secondary | accent | warn (warn = caution only)
#                 description  one-line definition shown in forms and tooltips
#   facet       true -> appears in the filter panel. select => single-choice filter, others => multi-choice
#   card        true|false|badge|chip|meta|icon|line|fact -> how (and whether) the field shows on catalog cards.
#                 true keeps the type default (select => badge, text => meta, list/multiselect => chip).
#                 icon = the at-a-glance signal strip; line = one short line under the summary.
#                 fact = the ENTRY PAGE fact strip only, never the card — for a fact that
#                 decides a reuse question but does not survive a 288px card.
#   weight      1..9 (default 5). Ordering inside a card slot, the fact strip, a filter group and a
#               sidebar section; lower wins when a slot cap truncates.
#   icon        icon name for the field (filter group header, fact strip, card line/icon fallback)
#   group       key from `groups` below; drives filter-panel grouping and submit-wizard steps
#   search      true -> included in the search index (title + summary always are; facets always are)
#   form        false -> hidden from the submission forms (maintainer-only field, e.g. `featured`)
#   thumbnail   (file fields) true -> a thumb.jpg is generated from this PDF's first page in CI
#
# `title`, `slug`, `summary`, `published`, `updated`, `thumbnail`, `featured` are always present
# in every entry, whether or not they are listed here.
# ---------------------------------------------------------------------------

entry:
  singular: "Use case"        # how one entry is referred to in the UI
  plural: "Use cases"
  path: "catalog"             # folder + URL base for entries (keep as "catalog" unless you know why)
  sort: "published"           # default catalog ordering key
  sort_order: "desc"          # asc | desc

# Ordered groups: { key, title, description?, icon?, placement? }.
# Filters show facet fields grouped this way; the submit wizard turns each group
# with form fields into a step. Fields with no group land in "other".
#   placement   rail | main (default main) -> on the entry page, `rail` groups become
#               sidebar cards instead of body sections. Keep it to the short,
#               act-on-it groups (links to reuse, who to contact); a 280px rail
#               cannot hold prose.
groups:
  - key: about
    title: "About"
    description: "What it is, who built it, and what it changed."
  - key: build
    title: "How it's built"
    description: "The AI involved and where it runs."
  - key: reuse
    title: "Reuse"
    description: "What it would take for another team to use this."
    placement: rail
  - key: cost
    title: "What it took"
    description: "Money, contracting and approvals — the part a budget or governance conversation needs."
    icon: credit-card
  - key: data
    title: "Data & access"
    description: "What data it touches and who sees the output."
  - key: contact
    title: "Contact"
    description: "Someone others can reach out to."
    placement: rail
  - key: story
    title: "The story"
    description: "Problem, approach, what it took, results and lessons."

fields:
  - key: title
    label: "Title"
    prompt: "What is it called?"
    type: text
    required: true
    group: about
    weight: 1
    placeholder: "Automated 311 call triage with LLM classification"
    description: "Specific enough that someone scanning a list of names knows what it is."

  - key: organization
    label: "Organization"
    prompt: "Which organization is sharing this?"
    type: text
    required: true
    group: about
    # Last in the About group on purpose: organization is a disambiguator, not
    # an entry point. At weight 2 the filter rail opened with a column of one-off
    # organization names and pushed "Area of work" below the fold.
    weight: 8
    facet: true
    card: meta
    search: true
    icon: building
    placeholder: "Chicago Department of Public Health"
    description: "A health department, city, agency or member organization."

  - key: solution_type
    label: "What is being shared"
    prompt: "What are you sharing?"
    type: select
    required: true
    group: about
    weight: 3
    facet: true
    card: badge
    icon: layers
    options:
      - "Source code"
      - "Cloud deployment"
      - "Vendor product"
      - "Internal tool"
      - "Playbook or write-up"
    option_meta:
      "Source code":
        icon: code
        description: "A repository (GitHub, GitLab, Azure DevOps…) others can clone."
      "Cloud deployment":
        icon: cloud
        description: "A deployable stack or template on AWS, Azure, GCP or similar."
      "Vendor product":
        icon: building
        description: "A commercial product or partnership, described so others can evaluate it."
      "Internal tool":
        icon: lock
        description: "Built and used in-house; the write-up is what's shared, not the code."
      "Playbook or write-up":
        icon: book-open
        description: "Guidance, policy, evaluation or lessons — no software to install."
    description: "Pick the closest match."

  - key: area
    label: "Area of work"
    prompt: "Which areas of work does it apply to?"
    type: multiselect
    required: true
    group: about
    weight: 4
    facet: true
    card: chip
    icon: tag
    options:
      - "Epidemiology & surveillance"
      - "Clinical & community services"
      - "Environmental health"
      - "Emergency preparedness"
      - "Communications & outreach"
      - "Data & informatics"
      - "Policy & planning"
      - "HR & workforce"
      - "Finance, procurement & contracts"
      - "IT & operations"
      - "Legal & compliance"
      - "Staff & partner coordination"
      - "Leadership & administration"
    option_meta:
      "Epidemiology & surveillance": { short: "Epidemiology" }
      "Clinical & community services": { short: "Clinical" }
      "Environmental health": { short: "Environmental" }
      "Emergency preparedness": { short: "Preparedness" }
      "Communications & outreach": { short: "Communications" }
      "Data & informatics": { short: "Data" }
      "Policy & planning": { short: "Policy" }
      "HR & workforce": { short: "HR & workforce" }
      "Finance, procurement & contracts": { short: "Procurement" }
      "IT & operations": { short: "IT & ops" }
      "Legal & compliance": { short: "Legal" }
      "Staff & partner coordination": { short: "Coordination" }
      "Leadership & administration": { short: "Leadership" }
    description: "Select all that fit — these are business functions as much as health programs."

  - key: stage
    label: "Stage"
    prompt: "How far along is it?"
    type: select
    required: true
    group: about
    weight: 5
    facet: true
    card: meta
    icon: flag
    options:
      - "Idea / exploring"
      - "Pilot"
      - "In production"
      - "Paused or retired"
    option_meta:
      "Idea / exploring": { short: "Exploring", description: "Scoping or prototyping; nothing in regular use yet." }
      "Pilot": { description: "In limited use with real users while it is evaluated." }
      "In production": { short: "In production", tone: primary, description: "In regular, supported use." }
      "Paused or retired": { short: "Retired", description: "No longer active — shared for the lessons." }
    description: "Pick the stage that matches real use, not the plan."

  - key: summary
    label: "Summary"
    prompt: "In one or two sentences, what does it do?"
    type: textarea
    required: true
    group: about
    weight: 6
    description: "Shown on the catalog card. Plain language, no jargon."
    placeholder: "Classifies incoming public health hotline calls by urgency and topic so nurses see the highest-priority cases first."

  - key: impact
    label: "Result in one line"
    prompt: "What is the single most concrete result so far?"
    type: text
    group: about
    weight: 7
    card: line
    icon: trending-up
    search: true
    placeholder: "Cut brief turnaround from 3 days to 1 hour"
    description: "A number if you have one."

  - key: ai_role
    label: "How AI is involved"
    prompt: "Is the AI in the product, or was AI used to build it?"
    type: select
    required: true
    group: build
    weight: 1
    facet: true
    icon: sparkles
    options:
      - "AI is part of the solution"
      - "AI was used to build it"
      - "Both"
    option_meta:
      "AI is part of the solution": { short: "In solution", description: "The running system uses AI (a model, an assistant, an automation)." }
      "AI was used to build it": { short: "Built with AI", description: "AI tools helped write the code, docs or analysis, but the product itself doesn't use AI." }
      "Both": { description: "AI is in the product and was used to build it." }

  - key: ai_types
    label: "Types of AI"
    prompt: "What kinds of AI does it use?"
    type: multiselect
    group: build
    weight: 2
    facet: true
    icon: cpu
    options:
      - "Generative text (LLM)"
      - "Chat assistant"
      - "Document Q&A (RAG)"
      - "Classification & NLP"
      - "Prediction & forecasting"
      - "Computer vision"
      - "Speech & transcription"
      - "Translation"
      - "Agents & automation"
      - "Rules-based (no ML)"
    option_meta:
      "Generative text (LLM)": { short: "Text (LLM)", description: "Drafts, summarizes or rewrites text with a large language model." }
      "Chat assistant": { short: "Chat", description: "A conversational interface for staff or the public." }
      "Document Q&A (RAG)": { short: "Document Q&A", description: "Answers questions from your own documents (retrieval-augmented generation)." }
      "Classification & NLP": { short: "Classification", description: "Sorts, tags or extracts information from text." }
      "Prediction & forecasting": { short: "Prediction", description: "Predicts risk, demand or trends from historical data." }
      "Computer vision": { short: "Vision", description: "Reads images, video or scanned documents." }
      "Speech & transcription": { short: "Speech", description: "Transcribes or understands spoken audio." }
      "Translation": { description: "Translates between languages." }
      "Agents & automation": { short: "Agents", description: "Multi-step automation where the AI takes actions." }
      "Rules-based (no ML)": { short: "Rules-based", description: "Deterministic logic — shared here for comparison." }
    description: "Select all that apply."

  - key: ai_tools
    label: "AI tools & models"
    prompt: "Which AI tools, models or services does it use?"
    type: list
    group: build
    weight: 3
    facet: true
    search: true
    icon: terminal
    placeholder: "Azure OpenAI GPT-4o, LangChain, custom scikit-learn model"
    description: "Name the models, platforms or libraries that matter."

  - key: platform
    label: "Where it runs"
    prompt: "Where does it run?"
    type: multiselect
    group: build
    weight: 4
    facet: true
    icon: server
    options:
      - "AWS"
      - "Microsoft Azure"
      - "Google Cloud"
      - "On-premises"
      - "Vendor / SaaS hosted"
      - "Enterprise AI workspace"
      - "Low-code platform"
      - "Desktop or local"
    option_meta:
      "Microsoft Azure": { short: "Azure" }
      "Google Cloud": { short: "GCP" }
      "On-premises": { short: "On-prem" }
      "Vendor / SaaS hosted": { short: "SaaS", description: "Runs on the vendor's infrastructure." }
      "Enterprise AI workspace": { short: "AI workspace", description: "Microsoft 365 Copilot, ChatGPT Enterprise, Gemini for Workspace and similar." }
      "Low-code platform": { short: "Low-code", description: "Power Platform, Airtable, n8n and similar." }
      "Desktop or local": { short: "Local", description: "Runs on a laptop or workstation." }
    description: "Select all that apply."

  - key: vendor
    label: "Vendor or partner"
    prompt: "If a vendor or partner built or hosts it, who?"
    type: text
    group: build
    weight: 5
    search: true
    placeholder: "Acme Health AI"
    description: "Leave it blank if your own team built it."

  - key: expertise
    label: "Skills needed to set it up"
    prompt: "Who is the least technical person who could get this running?"
    type: select
    required: true
    group: reuse
    weight: 1
    facet: true
    card: icon
    icon: academic-cap
    options:
      - "Anyone on staff"
      - "Power user"
      - "Analyst or data scientist"
      - "Developer"
      - "Contractor or vendor"
    option_meta:
      "Anyone on staff": { short: "Anyone", icon: user, description: "No technical skills — follow the instructions." }
      "Power user": { icon: adjustments, description: "Someone comfortable with spreadsheets, forms and low-code tools." }
      "Analyst or data scientist": { short: "Analyst", icon: chart-bar, description: "Someone who works in Python, R or SQL." }
      "Developer": { icon: code, description: "A software developer to deploy or adapt it." }
      "Contractor or vendor": { short: "Contractor", icon: wrench, description: "Outside help is required to stand this up." }
    description: "Judge it by setting the thing up, not by using it afterwards."

  - key: readiness
    label: "Readiness"
    prompt: "What would another team need before they could use this?"
    type: multiselect
    group: reuse
    weight: 2
    facet: true
    card: icon
    icon: rocket
    options:
      - "Ready to deploy"
      - "Guided setup"
      - "Needs customization"
      - "Needs a contractor"
      - "Needs a paid license"
      - "Needs a data agreement"
      - "Human review built in"
      - "Reference only"
    option_meta:
      "Ready to deploy": { short: "Ready", icon: rocket, tone: primary, description: "Can be used as-is with minimal configuration." }
      "Guided setup": { short: "Guided setup", icon: wand, description: "A wizard or script walks you through installation." }
      "Needs customization": { short: "Needs config", icon: adjustments, description: "Your team will need to adapt it before use." }
      "Needs a contractor": { short: "Needs vendor", icon: wrench, description: "Requires a contractor or vendor to implement." }
      "Needs a paid license": { short: "Paid license", icon: credit-card, description: "Depends on a paid product, API or subscription." }
      "Needs a data agreement": { short: "Data agreement", icon: document, description: "A data-sharing or BAA-type agreement is required." }
      "Human review built in": { short: "Human review", icon: eye, description: "A person checks the AI's output before it is used." }
      "Reference only": { short: "Reference", icon: book-open, description: "Documentation and lessons — not something to deploy." }
    description: "Select all that apply."

  - key: repo_url
    label: "Source code"
    prompt: "If the code is public, where?"
    type: url
    group: reuse
    weight: 3
    icon: code
    placeholder: "https://github.com/your-org/your-project"
    description: "GitHub, GitLab, Azure DevOps or any public repository."

  - key: demo_url
    label: "Live site or demo"
    prompt: "Link to a live site or demo"
    type: url
    group: reuse
    weight: 4
    icon: globe
    placeholder: "https://example.org/app"

  - key: docs_url
    label: "Documentation or write-up"
    prompt: "Link to documentation, slides or a write-up"
    type: url
    group: reuse
    weight: 5
    icon: document
    placeholder: "https://example.org/docs"
    description: "A report, a blog post or a vendor case study all count."

  - key: resources
    label: "Other resources"
    prompt: "Anything else worth linking?"
    type: links
    group: reuse
    weight: 6
    icon: link
    placeholder: "Evaluation report | https://drive.google.com/…"
    description: "Shared drives, SharePoint, model cards, container images, vendor pages."

  - key: screenshots
    label: "Screenshots"
    prompt: "Screenshots of it in use"
    type: images
    group: reuse
    weight: 7
    icon: image
    description: "Up to eight PNG, JPEG, GIF or WebP images of the tool in use (15 MB total). Make sure no personal or protected information is visible."

  - key: deck_pdf
    label: "Slide deck or one-pager (PDF)"
    prompt: "Slide deck or one-pager"
    type: file
    filename: "deck.pdf"
    thumbnail: true
    group: reuse
    weight: 8
    icon: presentation
    description: "Attach the slide deck here. A thumbnail is generated from its first page."

  # ---------------------------------------------------------------------------
  # "What it took" (group: cost). The five fields below are a STARTING DRAFT for
  # the site owner to edit, not a standard: the dollar bands are a US-local
  # choice, and the review names ("Records retention review", "Research ethics /
  # IRB") are the ones a US public health department recognises. Rewrite the
  # options to match how your organization actually budgets, buys and approves —
  # nothing downstream depends on these particular strings.
  # ---------------------------------------------------------------------------
  - key: cost_band
    label: "Cost to stand up"
    prompt: "Roughly what did it cost to get it running the first time?"
    type: select
    group: cost
    weight: 1
    facet: true
    card: fact
    icon: credit-card
    options:
      - "No new spend"
      - "Under $25k"
      - "$25k–$100k"
      - "$100k–$500k"
      - "Over $500k"
      - "Not disclosed"
    option_meta:
      "No new spend": { tone: primary, description: "Built with licences, staff and infrastructure the organization already had." }
      "Not disclosed": { description: "The submitter cannot share cost publicly. Ask the contact." }
    description: "One-time cost: contracts, build, implementation. A band is fine — nobody expects an exact figure."

  - key: run_cost
    label: "Cost to keep running"
    prompt: "What does a normal year cost to run?"
    type: select
    group: cost
    weight: 2
    facet: true
    icon: clock
    options:
      - "No ongoing cost"
      - "Under $10k/yr"
      - "$10k–$50k/yr"
      - "Over $50k/yr"
      - "Not disclosed"
    option_meta:
      "No ongoing cost": { short: "No run cost", tone: primary }
      "Not disclosed": { description: "The submitter cannot share cost publicly. Ask the contact." }
    description: "Licences, hosting and usage charges only — staff time belongs in the write-up."

  - key: procurement
    label: "How it was bought"
    prompt: "How was this paid for or contracted?"
    type: multiselect
    group: cost
    weight: 3
    facet: true
    icon: document
    options:
      - "No procurement needed"
      - "Existing enterprise licence"
      - "Cooperative or piggyback contract"
      - "Competitive solicitation"
      - "Sole source"
      - "Grant funded"
      - "Interagency agreement"
      - "In-kind or academic partnership"
    option_meta:
      "No procurement needed": { short: "None needed" }
      "Existing enterprise licence": { short: "Already owned", description: "Covered by a contract the organization already held." }
      "Cooperative or piggyback contract": { short: "Cooperative", description: "Bought off another jurisdiction's or a co-op's contract." }
      "Competitive solicitation": { short: "Competitive", description: "An RFP, RFQ or equivalent open competition." }
      "Sole source": { description: "Awarded without competition, with a written justification." }
      "Grant funded": { short: "Grant" }
      "Interagency agreement": { short: "Interagency", description: "Paid through an agreement with another public agency." }
      "In-kind or academic partnership": { short: "Partnership" }
    description: "Select all that apply. This is the question peers ask most and the one that is hardest to find out."

  - key: approvals
    label: "Reviews it went through"
    prompt: "Which internal reviews or approvals did it need?"
    type: multiselect
    group: cost
    weight: 4
    facet: true
    card: fact
    icon: shield-check
    options:
      - "Privacy review"
      - "Security review or authority to operate"
      - "Legal or contracts review"
      - "Records retention review"
      - "Labor or workforce consultation"
      - "Community or advisory review"
      - "Equity impact assessment"
      - "Research ethics / IRB"
      - "AI governance body"
      - "None required"
      - "Not yet reviewed"
    option_meta:
      "Security review or authority to operate": { short: "Security", description: "A security assessment, ATO or equivalent sign-off." }
      "Legal or contracts review": { short: "Legal" }
      "Records retention review": { short: "Records", description: "Confirmed how long the outputs must be kept and where." }
      "Labor or workforce consultation": { short: "Labor", description: "Discussed with the union or the affected staff before rollout." }
      "Community or advisory review": { short: "Community", icon: users }
      "Equity impact assessment": { short: "Equity review", icon: users }
      "Research ethics / IRB": { short: "IRB" }
      "AI governance body": { short: "AI governance", description: "An internal AI review board or committee signed off." }
      "Not yet reviewed": { short: "No review yet", tone: warn, description: "Shared honestly — this has not been through a formal review." }
    description: "Select all that apply. Saying 'not yet reviewed' is more useful to a peer than leaving it blank."

  - key: equity_note
    label: "Who it affects"
    prompt: "Who could this help or harm, and how did you check?"
    type: textarea
    group: cost
    weight: 5
    placeholder: "Reaches everyone who calls the hotline, including the ~18% who use it in Spanish. We compared triage accuracy across language groups monthly and would stop if the gap grew."
    description: "Optional but strongly encouraged. Which populations the output reaches, what you checked for uneven performance, and what you would watch."

  - key: data_sensitivity
    label: "Data it touches"
    prompt: "What kind of data does it touch?"
    type: multiselect
    required: true
    group: data
    weight: 1
    facet: true
    card: icon
    icon: shield
    options:
      - "Public data only"
      - "De-identified data"
      - "Internal, non-public data"
      - "Personal information (PII)"
      - "Health information (PHI)"
      - "Criminal justice data (CJIS)"
    option_meta:
      "Public data only": { short: "Public data", icon: globe, description: "Only data that is already public." }
      "De-identified data": { short: "De-identified", icon: shield-check, description: "Personal identifiers removed before use." }
      "Internal, non-public data": { short: "Internal data", icon: lock, description: "Non-public operational data without personal identifiers." }
      "Personal information (PII)": { short: "PII", icon: shield, tone: warn, description: "Names, addresses, IDs or other personal identifiers." }
      "Health information (PHI)": { short: "PHI", icon: shield, tone: warn, description: "Identifiable health information covered by HIPAA." }
      "Criminal justice data (CJIS)": { short: "CJIS", icon: shield, tone: warn, description: "Data subject to CJIS security policy." }
    description: "Select all that apply. This helps others judge governance and approval effort."

  - key: data_sources
    label: "Data sources"
    prompt: "Which data sources does it use?"
    type: list
    group: data
    weight: 2
    search: true
    icon: database
    placeholder: "Immunization registry, 311 call transcripts, ESSENCE"
    description: "Describe the sources — do not paste sensitive data."

  - key: audience
    label: "Who sees the output"
    prompt: "Who sees the output?"
    type: select
    required: true
    group: data
    weight: 3
    facet: true
    card: icon
    icon: users
    options:
      - "Public-facing"
      - "Internal staff"
      - "Partner organizations"
    option_meta:
      "Public-facing": { short: "Public", icon: globe, description: "Residents or the general public interact with it." }
      "Internal staff": { short: "Internal", icon: lock, description: "Used only inside the organization." }
      "Partner organizations": { short: "Partners", icon: users, description: "Shared with specific partner organizations." }
    description: "Pick the widest group that sees anything it produces."

  - key: contact_name
    label: "Contact name"
    prompt: "Who can people contact?"
    type: text
    required: true
    group: contact
    weight: 1
    placeholder: "Jordan Lee"
    description: "Someone happy to answer questions from another team."

  - key: contact_email
    label: "Contact email"
    prompt: "What is their email?"
    type: email
    required: true
    group: contact
    weight: 2
    placeholder: "jordan.lee@city.gov"

  - key: body
    label: "Full write-up"
    prompt: "What's the story?"
    type: markdown
    required: true
