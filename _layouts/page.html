---
layout: default
---
<article class="mx-auto max-w-3xl">
  {% if page.eyebrow %}<span class="eyebrow">{{ page.eyebrow }}</span>{% endif %}
  <h1 class="mt-2 font-heading text-4xl font-semibold text-brand-primary-dark sm:text-5xl">{{ page.title }}</h1>
  {% if page.summary %}<p class="mt-4 text-lg leading-relaxed text-brand-muted">{{ page.summary }}</p>{% endif %}
  <div class="prose-body mt-8">
    {{ content }}
  </div>
</article>
