name: Update cohort schedule

on:
  issues:
    types:
      - opened
      - edited

# Set the repository variable SUBMISSIONS_OPEN to `false` to accept issues from
# members and collaborators only; leaving it unset keeps them open.
#
# The jobs below declare exactly the scopes they need; nothing is granted by default.
permissions: {}

# One run per issue: editing an issue three times in a minute must not leave
# three jobs force-pushing the same branch at each other.
concurrency:
  group: update-schedule-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  update:
    if: >-
      contains(github.event.issue.labels.*.name, 'content:schedule')
      && (vars.SUBMISSIONS_OPEN != 'false'
          || contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.3"

      - name: Preview normalized event IDs
        id: preview
        run: ruby scripts/preview_schedule_ids_from_issue.rb
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}

      - name: Comment with the event ID preview
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PREVIEW_YEAR: ${{ steps.preview.outputs.year }}
          PREVIEW_IDS: ${{ steps.preview.outputs.preview_ids }}
        with:
          script: |
            const year = process.env.PREVIEW_YEAR;
            const body = [
              `### Event ID preview for ${year}`,
              '',
              process.env.PREVIEW_IDS,
              '',
              `Event pages will live at \`/cohorts/${year}/events/<id>/\` once this is merged.`
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Update schedule data
        id: update
        run: ruby scripts/update_schedule_from_issue.rb
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}

      - name: Create pull request
        if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: ${{ steps.update.outputs.branch }}
          commit-message: "chore: update cohort ${{ steps.update.outputs.year }} schedule"
          title: "Update cohort ${{ steps.update.outputs.year }} schedule"
          body: |
            Generated from issue #${{ github.event.issue.number }}.

            ### Updated events
            ${{ steps.update.outputs.summary }}
          delete-branch: true

      - name: Comment when nothing changed
        if: steps.update.outputs.changed != 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'No schedule changes were detected — the submitted entries already match the stored schedule.'
            });
