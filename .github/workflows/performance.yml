name: Performance and scale

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      counts:
        description: Comma-separated fixture sizes from 0,1,10,100,500,1000
        required: false
        default: "0,1,10,100,500,1000"
        type: string

permissions:
  contents: read

concurrency:
  group: performance-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  scale:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Ruby from .ruby-version
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          bundler-cache: true

      - name: Setup Node from .node-version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          cache: npm

      - name: Select exact npm
        run: node scripts/install_exact_npm.mjs

      - name: Install npm dependencies and build CSS
        run: |
          npm ci
          npm run build:css

      - name: Build deterministic scale fixtures
        env:
          DISPATCH_COUNTS: ${{ inputs.counts }}
        run: |
          counts="${DISPATCH_COUNTS:-0,1,10,100,500,1000}"
          node scripts/performance_fixture.mjs --counts "$counts" --output performance-report.json

      - name: Upload scale evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-${{ github.sha }}
          path: performance-report.json
          if-no-files-found: warn
          retention-days: 30

  status:
    name: Report the dispatched run on its commit
    if: ${{ always() && github.event_name == 'workflow_dispatch' }}
    needs: [scale]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write

    steps:
      - name: Post a commit status
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const passed = ${{ toJSON(needs.scale.result) }} === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'Performance and scale (dispatch)',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: passed ? 'Scale budgets passed' : 'Scale budgets reported problems',
            });
