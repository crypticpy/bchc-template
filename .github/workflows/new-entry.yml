name: New entry from issue

on:
  issues:
    types:
      - opened
      - edited

jobs:
  scaffold:
    if: contains(github.event.issue.labels.*.name, 'content:new-entry')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Scaffold entry files
        id: scaffold
        continue-on-error: true
        run: node scripts/new_entry_from_issue.mjs
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}

      - name: Report the failure on the issue
        if: steps.scaffold.outcome == 'failure'
        uses: actions/github-script@v7
        env:
          SCAFFOLD_ERROR: ${{ steps.scaffold.outputs.error }}
        with:
          script: |
            const detail = process.env.SCAFFOLD_ERROR || 'The scaffolding step failed; see the workflow logs for details.';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                'This submission could not be turned into a pull request yet.',
                '',
                '> ' + detail.split('\n').join('\n> '),
                '',
                'Edit this issue to fix the problem and the automation will try again.'
              ].join('\n')
            });
            core.setFailed(detail);

      - name: Create pull request
        if: steps.scaffold.outcome == 'success'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: ${{ steps.scaffold.outputs.branch }}
          commit-message: "feat: add entry ${{ steps.scaffold.outputs.slug }}"
          title: "Add entry: ${{ steps.scaffold.outputs.title }}"
          body: |
            Generated from issue #${{ github.event.issue.number }}.

            Closes #${{ github.event.issue.number }}

            ### Maintainer checklist
            - [ ] Review the entry content and front matter for accuracy
            - [ ] Upload any PDFs or images into `catalog/${{ steps.scaffold.outputs.slug }}/`
            - [ ] Confirm the content validation check passes
            - [ ] Merge to publish
          delete-branch: true
