name: Validate Content

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Generated files are in sync with _data/schema.yml
        # Fails when .github/ISSUE_TEMPLATE/new-entry.yml, _config.yml or the
        # configurator defaults would change. Fix locally with `npm run generate`.
        run: node scripts/generate.mjs --check

      - name: Lint (ESLint) and formatting (Prettier)
        run: npm run lint && npm run format:check

      - name: Unit tests (Node)
        run: npm test

      - name: Unit tests (Ruby)
        run: npm run test:ruby

      - name: Validate data files, front matter and file sizes
        run: npm run validate

      - name: Build CSS
        run: npm run build:css

      - name: Build site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --destination _site
