name: Generate entry thumbnails

# Renders the first page of every entry PDF to catalog/<slug>/thumb.jpg.
#
# Uses `pdftoppm` (poppler-utils) rather than ImageMagick: ubuntu-latest ships
# ImageMagick 6, whose `magick` command does not exist, and its PDF delegate is
# disabled by policy on many images. pdftoppm needs neither.

on:
  pull_request:
    paths:
      - "catalog/**/*.pdf"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  thumbnail:
    # Pull requests from forks run with a read-only token and cannot be pushed to.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Install poppler-utils
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Generate thumbnails
        run: |
          set -euo pipefail
          node scripts/thumbnail_sources.mjs | while IFS=$'\t' read -r source thumb; do
            [ -n "$source" ] || continue
            if [ ! -s "$source" ]; then
              echo "Skipping empty placeholder at $source"
              continue
            fi
            signature="$(head -c4 "$source" 2>/dev/null || true)"
            if [ "$signature" != "%PDF" ]; then
              echo "Skipping non-PDF file at $source (signature: $signature)"
              continue
            fi
            if [ -f "$thumb" ] && [ ! "$source" -nt "$thumb" ]; then
              continue
            fi
            echo "Generating thumbnail for $source"
            # -singlefile writes "<prefix>.jpg" with no page-number suffix.
            # -scale-to-y -1 keeps the aspect ratio of the 800px-wide render.
            pdftoppm -jpeg -jpegopt quality=85 -scale-to-x 800 -scale-to-y -1 \
              -f 1 -l 1 -singlefile "$source" "${thumb%.jpg}"
          done

      - name: Commit thumbnails
        env:
          BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A "catalog"
          if git diff --cached --quiet; then
            echo "No thumbnail changes."
            exit 0
          fi
          git commit -m "chore: update entry thumbnails"
          git push origin "HEAD:refs/heads/$BRANCH"
