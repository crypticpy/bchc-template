name: New event from issue

on:
  issues:
    types:
      - opened
      - edited

# One run per issue: editing an issue three times in a minute must not leave
# three jobs force-pushing the same branch at each other.
concurrency:
  group: new-event-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  scaffold:
    if: contains(github.event.issue.labels.*.name, 'content:new-event')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: List the events already scheduled for this year
        id: list
        run: node scripts/list_events_for_year.mjs
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}

      - name: Comment with the existing schedule for reference
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          LIST_YEAR: ${{ steps.list.outputs.year }}
          LIST_EVENTS: ${{ steps.list.outputs.events_md }}
        with:
          script: |
            const body = [
              `### Events currently scheduled for ${process.env.LIST_YEAR}`,
              '',
              process.env.LIST_EVENTS,
              '',
              'Leave **Event ID** blank to generate one from the title, or reuse an ID above to match the schedule.'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Scaffold event page
        id: scaffold
        run: node scripts/new_event_from_issue.mjs
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}

      - name: Create pull request
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6.1.0
        with:
          branch: ${{ steps.scaffold.outputs.branch }}
          commit-message: "feat: add event ${{ steps.scaffold.outputs.slug }}"
          title: "Add event: ${{ steps.scaffold.outputs.year }} ${{ steps.scaffold.outputs.slug }}"
          body: |
            Generated from issue #${{ github.event.issue.number }}.

            Closes #${{ github.event.issue.number }}
          delete-branch: true
