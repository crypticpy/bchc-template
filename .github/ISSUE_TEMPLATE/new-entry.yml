# GitHub issue form for new entries.
# Generated from _data/schema.yml by scripts/generate.mjs — do not hand-edit.
# Regenerate with `npm run generate` after changing _data/schema.yml.

name: Submit a use case (creates PR)
description: "Share an AI use case, tool or project with the coalition. Submissions open a GitHub issue for the maintainers to review; nothing is published until it is approved."
title: "[Use case] "
labels:
  - "content:new-entry"
body:
  - type: markdown
    attributes:
      value: "Please do not include protected health information, credentials or non-public data. Link out to repositories and documents rather than pasting sensitive content."
  - type: markdown
    attributes:
      value: |-
        ### About

        What it is, who built it, and what it changed.
  - type: input
    id: title
    attributes:
      label: Title
      description: What is it called? Specific enough that someone scanning a list of names knows what it is.
      placeholder: Automated 311 call triage with LLM classification
    validations:
      required: true
  - type: input
    id: organization
    attributes:
      label: Organization
      description: "Which organization is sharing this? A health department, city, agency or member organization."
      placeholder: Chicago Department of Public Health
    validations:
      required: true
  - type: dropdown
    id: solution_type
    attributes:
      label: What is being shared
      description: What are you sharing? Pick the closest match.
      options:
        - Source code
        - Cloud deployment
        - Vendor product
        - Internal tool
        - Playbook or write-up
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area of work
      description: Which areas of work does it apply to? Select all that fit — these are business functions as much as health programs.
      multiple: true
      options:
        - "Epidemiology & surveillance"
        - "Clinical & community services"
        - Environmental health
        - Emergency preparedness
        - "Communications & outreach"
        - "Data & informatics"
        - "Policy & planning"
        - "HR & workforce"
        - "Finance, procurement & contracts"
        - "IT & operations"
        - "Legal & compliance"
        - "Staff & partner coordination"
        - "Leadership & administration"
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Stage
      description: "How far along is it? Pick the stage that matches real use, not the plan."
      options:
        - Idea / exploring
        - Pilot
        - In production
        - Paused or retired
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: "In one or two sentences, what does it do? Shown on the catalog card. Plain language, no jargon."
      placeholder: Classifies incoming public health hotline calls by urgency and topic so nurses see the highest-priority cases first.
    validations:
      required: true
  - type: input
    id: impact
    attributes:
      label: Result in one line
      description: What is the single most concrete result so far? A number if you have one.
      placeholder: Cut brief turnaround from 3 days to 1 hour
    validations:
      required: false
  - type: markdown
    attributes:
      value: |-
        ### How it's built

        The AI involved and where it runs.
  - type: dropdown
    id: ai_role
    attributes:
      label: How AI is involved
      description: "Is the AI in the product, or was AI used to build it?"
      options:
        - AI is part of the solution
        - AI was used to build it
        - Both
    validations:
      required: true
  - type: dropdown
    id: ai_types
    attributes:
      label: Types of AI
      description: What kinds of AI does it use? Select all that apply.
      multiple: true
      options:
        - Generative text (LLM)
        - Chat assistant
        - "Document Q&A (RAG)"
        - "Classification & NLP"
        - "Prediction & forecasting"
        - Computer vision
        - "Speech & transcription"
        - Translation
        - "Agents & automation"
        - Rules-based (no ML)
    validations:
      required: false
  - type: textarea
    id: ai_tools
    attributes:
      label: "AI tools & models"
      description: "Which AI tools, models or services does it use? Name the models, platforms or libraries that matter. One per line, or separated by commas."
      placeholder: "Azure OpenAI GPT-4o, LangChain, custom scikit-learn model"
    validations:
      required: false
  - type: dropdown
    id: platform
    attributes:
      label: Where it runs
      description: Where does it run? Select all that apply.
      multiple: true
      options:
        - AWS
        - Microsoft Azure
        - Google Cloud
        - On-premises
        - Vendor / SaaS hosted
        - Enterprise AI workspace
        - Low-code platform
        - Desktop or local
    validations:
      required: false
  - type: input
    id: vendor
    attributes:
      label: Vendor or partner
      description: "If a vendor or partner built or hosts it, who? Leave it blank if your own team built it."
      placeholder: Acme Health AI
    validations:
      required: false
  - type: markdown
    attributes:
      value: |-
        ### Reuse

        What it would take for another team to use this.
  - type: dropdown
    id: expertise
    attributes:
      label: Skills needed to set it up
      description: "Who is the least technical person who could get this running? Judge it by setting the thing up, not by using it afterwards."
      options:
        - Anyone on staff
        - Power user
        - Analyst or data scientist
        - Developer
        - Contractor or vendor
    validations:
      required: true
  - type: dropdown
    id: readiness
    attributes:
      label: Readiness
      description: What would another team need before they could use this? Select all that apply.
      multiple: true
      options:
        - Ready to deploy
        - Guided setup
        - Needs customization
        - Needs a contractor
        - Needs a paid license
        - Needs a data agreement
        - Human review built in
        - Reference only
    validations:
      required: false
  - type: input
    id: repo_url
    attributes:
      label: Source code
      description: "If the code is public, where? GitHub, GitLab, Azure DevOps or any public repository."
      placeholder: "https://github.com/your-org/your-project"
    validations:
      required: false
  - type: input
    id: demo_url
    attributes:
      label: Live site or demo
      description: Link to a live site or demo.
      placeholder: "https://example.org/app"
    validations:
      required: false
  - type: input
    id: docs_url
    attributes:
      label: Documentation or write-up
      description: "Link to documentation, slides or a write-up. A report, a blog post or a vendor case study all count."
      placeholder: "https://example.org/docs"
    validations:
      required: false
  - type: textarea
    id: resources
    attributes:
      label: Other resources
      description: "Anything else worth linking? Shared drives, SharePoint, model cards, container images, vendor pages. One per line as `Label | URL`."
      placeholder: "Evaluation report | https://drive.google.com/…"
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: "Screenshots of it in use. Up to eight PNG, JPEG, GIF or WebP images of the tool in use (15 MB total). Make sure no personal or protected information is visible. Drag images into this box to upload them, or paste one image URL per line — optionally as `URL | alt text`."
    validations:
      required: false
  - type: markdown
    attributes:
      value: "**Slide deck or one-pager (PDF)** — GitHub issue forms cannot accept file uploads. After the pull request is created, upload `deck.pdf` into the entry folder."
  - type: markdown
    attributes:
      value: |-
        ### Data & access

        What data it touches and who sees the output.
  - type: dropdown
    id: data_sensitivity
    attributes:
      label: Data it touches
      description: What kind of data does it touch? Select all that apply. This helps others judge governance and approval effort.
      multiple: true
      options:
        - Public data only
        - De-identified data
        - "Internal, non-public data"
        - Personal information (PII)
        - Health information (PHI)
        - Criminal justice data (CJIS)
    validations:
      required: true
  - type: textarea
    id: data_sources
    attributes:
      label: Data sources
      description: "Which data sources does it use? Describe the sources — do not paste sensitive data. One per line, or separated by commas."
      placeholder: "Immunization registry, 311 call transcripts, ESSENCE"
    validations:
      required: false
  - type: dropdown
    id: audience
    attributes:
      label: Who sees the output
      description: Who sees the output? Pick the widest group that sees anything it produces.
      options:
        - Public-facing
        - Internal staff
        - Partner organizations
    validations:
      required: true
  - type: markdown
    attributes:
      value: |-
        ### Contact

        Someone others can reach out to.
  - type: input
    id: contact_name
    attributes:
      label: Contact name
      description: Who can people contact? Someone happy to answer questions from another team.
      placeholder: Jordan Lee
    validations:
      required: true
  - type: input
    id: contact_email
    attributes:
      label: Contact email
      description: What is their email?
      placeholder: "jordan.lee@city.gov"
    validations:
      required: true
  - type: markdown
    attributes:
      value: |-
        ### The story

        Problem, approach, what it took, results and lessons.
  - type: textarea
    id: body
    attributes:
      label: Full write-up
      description: "What's the story? Markdown is supported. Suggested headings: Problem, Approach, What it took (data, staffing, cost), Results, Lessons learned, How to reuse."
      value: |
        ## Problem

        ## Approach

        ## What it took

        ## Results

        ## Lessons learned

        ## How to reuse this
    validations:
      required: true
